name: phase1-ci

on: [push, workflow_dispatch]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tfci_app/requirements.txt
      - run: python tfci_app/pipelines/run_gate.py
      - working-directory: tfci_app
        run: python -m pytest api/test_main.py -q

  web:
    runs-on: ubuntu-latest
    needs: api
    if: hashFiles('web/package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
